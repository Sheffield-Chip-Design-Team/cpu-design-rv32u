# Quarto build of the RV32u mini-project site (from the UofT ASIC course template).
#
#   quarto preview docs          # live site at http://localhost:4200
#   quarto render docs           # site in docs/_site, with a PDF of every page
#   quarto render docs --profile pdf --to typst
#                                # the whole course as one PDF in docs/_book
#
# The sidebar follows the Course path order on the home page. docs/info.md is the
# Tiny Tapeout datasheet (read by the TT docs action), not a site page.

project:
  type: website
  output-dir: _site
  render:
    - index.md
    - guide/*.md
    - spec/*.md
    - milestones/*.md
  # quarto preview docs serves the site here (otherwise Quarto picks a random port).
  preview:
    port: 4200
    browser: false

website:
  title: "CPU Design Mini-Project - RV32u"
  description: "Design, verify and tape out a 14-instruction multi-cycle RISC-V core on Tiny Tapeout IHP"
  repo-url: https://github.com/Sheffield-Chip-Design-Team/rv32i-micro
  repo-subdir: docs
  repo-actions: [issue]
  search: true
  page-navigation: true
  navbar:
    left:
      - text: "Guide"
        href: guide/getting-started.md
      - text: "Specification"
        href: spec/01-overview.md
      - text: "Milestones"
        href: milestones/m1-building-blocks.md
      - text: "Resources"
        href: guide/resources.md
    right:
      # viewer/ is added by .github/workflows/site.yml from the latest GDS build: the
      # Tiny Tapeout 3D layout viewer (it does not exist in a local render).
      - text: Layout viewer
        icon: box
        href: viewer/index.html
      - text: Course PDF
        icon: file-pdf
        href: "rv32i-micro-course.pdf"
      - icon: github
        href: https://github.com/Sheffield-Chip-Design-Team/rv32i-micro
        aria-label: GitHub
  sidebar:
    style: docked
    contents:
      - text: "Home"
        href: index.md
      - section: "Guide"
        contents:
          - text: "Getting started"
            href: guide/getting-started.md
          - text: "The flow"
            href: guide/flow.md
          - text: "Resources"
            href: guide/resources.md
      - section: "Specification"
        contents:
          - text: "1. Overview"
            href: spec/01-overview.md
          - text: "2. ISA and architectural state"
            href: spec/02-isa.md
          - text: "3. Memory bus"
            href: spec/03-memory-bus.md
          - text: "4. Microarchitecture"
            href: spec/04-microarchitecture.md
          - text: "5. Control FSM"
            href: spec/05-control-fsm.md
          - text: "6. Retire port and traps"
            href: spec/06-retire-and-trap.md
          - text: "7. Memory subsystem"
            href: spec/07-memory-subsystem.md
          - text: "8. Software flow"
            href: spec/08-software-flow.md
          - text: "9. Verification"
            href: spec/09-verification.md
          - text: "10. Tiny Tapeout integration"
            href: spec/10-tiny-tapeout.md
          - text: "11. Deliverables and acceptance"
            href: spec/11-deliverables.md
      - section: "Milestones"
        contents:
          - text: "M1. Building blocks"
            href: milestones/m1-building-blocks.md
          - text: "M2. Datapath and FSM"
            href: milestones/m2-datapath-fsm.md
          - text: "M3. Running C"
            href: milestones/m3-running-c.md
          - text: "M4. Chip integration"
            href: milestones/m4-chip.md
      - section: "Repo"
        contents:
          - text: "Layout viewer (latest GDS)"
            href: viewer/index.html
          - text: "RTL (src/)"
            href: https://github.com/Sheffield-Chip-Design-Team/rv32i-micro/tree/main/src
          - text: "Tests (verif/)"
            href: https://github.com/Sheffield-Chip-Design-Team/rv32i-micro/tree/main/verif
          - text: "Software (sw/)"
            href: https://github.com/Sheffield-Chip-Design-Team/rv32i-micro/tree/main/sw
          - text: "Design record (DESIGN.md)"
            href: https://github.com/Sheffield-Chip-Design-Team/rv32i-micro/blob/main/DESIGN.md

filters:
  - _filters/course.lua

# Collapsed answers move to the end of each page in PDFs; set this to
# "inline" to print them where they sit instead.
answers-in-pdf: end

format:
  html:
    theme:
      light: [cosmo, _light.scss]
      dark: [darkly, _dark.scss]
    css: _styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    lightbox: auto
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"
    # Listing html first stops Quarto adding a second "Typst" link.
    format-links:
      - html
      - format: typst
        text: PDF
        icon: file-pdf
  typst:
    papersize: us-letter
    margin:
      x: 0.9in
      y: 0.9in
    fontsize: 10.5pt
    toc: false
