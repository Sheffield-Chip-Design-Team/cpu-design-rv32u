[project]
name = "rv32u-verif"
version = "0.1.0"
description = "Verification environment for the RV32u mini-project: FuseSoC + cocotb + a Python reference model"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fusesoc==2.4.6",
  "edalize==0.6.8",
  "cocotb==2.0.1",
  "pytest==8.4.2",
  "pyyaml==6.0.3",
]

[dependency-groups]
# Only for re-rendering the timing diagrams (scripts/render-wavedrom.py).
docs = ["wavedrom==2.0.3.post3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/hw"]
include = ["dv*"]

[tool.pytest.ini_options]
testpaths = ["src/hw/dv/model"]
addopts = "-ra"
