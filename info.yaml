# Tiny Tapeout project information
project:
  title:        "RV32u: a multi-cycle RISC-V core"      # Project title
  author:       "James Ashie Kotey"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A 14-instruction RV32I subset (RV32I-Micro) multi-cycle core with on-chip IHP SRAM"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  # Depends on your RAM (design decision D1, spec chapter 7): 6x2 for the SRAM macros.
  tiles: "6x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sharc_rv32u"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Packages first. Keep this list in step with the FuseSoC cores (src/hw/**/*.core): add your
  # SRAM wrappers (src/hw/pd/wrappers/) here if you use macros (D1). make mem-check compares them.
  source_files:
    - "hw/rtl/rv32u_pkg.sv"
    - "hw/rtl/cpu_ss/rv32u_cpu_ss.sv"
    - "hw/rtl/mem_ss/rv32u_ram.sv"
    - "hw/rtl/mem_ss/rv32u_mem_ss.sv"
    - "hw/rtl/io_ss/rv32u_io.sv"
    - "hw/rtl/io_ss/rv32u_loader.sv"
    - "hw/rtl/rv32u_soc.sv"
    - "hw/pd/tt_um_sharc_rv32u.sv"
    - "hw/pd/sram_bb.sv"

