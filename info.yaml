# Tiny Tapeout project information
project:
  title:        "RV32u: a multi-cycle RISC-V core"      # Project title
  author:       "James Ashie Kotey"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A 14-instruction RV32I subset (RV32I-Micro) multi-cycle core with on-chip IHP SRAM"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  # Set by scripts/select-memory.py with the memory option (design decision D1).
  tiles: "6x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sharc_rv32u"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Packages first. scripts/select-memory.py rewrites this list for the memory option (D1).
  source_files:
    - "rv32u_pkg.sv"
    - "core/rv32u_regfile.sv"
    - "core/rv32u_alu.sv"
    - "core/rv32u_immgen.sv"
    - "core/rv32u_control.sv"
    - "core/rv32u_datapath.sv"
    - "core/rv32u_core.sv"
    - "mem/rv32u_mem.sv"
    - "mem/ram_macro_512x32.sv"
    - "io/rv32u_io.sv"
    - "io/rv32u_loader.sv"
    - "rv32u_soc.sv"
    - "tt_um_sharc_rv32u.sv"
    - "sram_bb.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# Design decision D5: fill these in to match your loader (D2) and I/O (D3, D4).
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
